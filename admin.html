<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ريفال | لوحة الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function AdminApp() {
            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('refal_products');
                return saved ? JSON.parse(saved) : [];
            });

            const [orders, setOrders] = React.useState(() => {
                const savedOrders = localStorage.getItem('refal_orders');
                return savedOrders ? JSON.parse(savedOrders) : [];
            });

            const handleAddProduct = (e) => {
                e.preventDefault();
                const name = e.target.name.value;
                const price = Number(e.target.price.value);
                const category = e.target.category.value;
                const stock = Number(e.target.stock.value);
                const image = e.target.image.value || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400';

                const newProduct = { id: Date.now(), name, price, category, stock, image };
                const updatedProducts = [newProduct, ...products];
                
                setProducts(updatedProducts);
                localStorage.setItem('refal_products', JSON.stringify(updatedProducts));
                e.target.reset();
                alert('تم إضافة المنتج وتحديث النظام بنجاح!');
            };

            const deleteProduct = (id) => {
                if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                    const updated = products.filter(p => p.id !== id);
                    setProducts(updated);
                    localStorage.setItem('refal_products', JSON.stringify(updated));
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <span className="text-2xl font-black text-rose-600">⚙️ ريفال | لوحة التحكم</span>
                            <a href="index.html" className="text-xs bg-rose-50 text-rose-600 px-3 py-2 rounded-xl font-bold hover:bg-rose-100 transition">
                                🛍️ عودة لواجهة العميل
                            </a>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-8">
                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
                            <h2 className="text-2xl font-bold mb-6 text-gray-800">إضافة منتج جديد للمتجر</h2>
                            <form onSubmit={handleAddProduct} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">اسم المنتج</label>
                                    <input name="name" required className="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="مثال: عطر جريس الفاخر" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">السعر (بالجنيه المصري)</label>
                                    <input name="price" type="number" required className="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="850" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">القسم</label>
                                    <select name="category" className="w-full border rounded-xl px-4 py-3 bg-white outline-none focus:ring-2 focus:ring-rose-500">
                                        <option value="عطور">عطور</option>
                                        <option value="مكياج">مكياج</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">الكمية بالمخزن</label>
                                    <input name="stock" type="number" required className="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="15" />
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-bold text-gray-700 mb-2">رابط صورة المنتج (URL)</label>
                                    <input name="image" className="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="ضع رابط الصورة هنا (اختياري)" />
                                </div>
                                <div className="md:col-span-2">
                                    <button type="submit" className="w-full bg-rose-600 text-white py-4 rounded-xl font-bold hover:bg-rose-700 transition shadow-md">
                                        حفظ ونشر المنتج في المتجر 🚀
                                    </button>
                                </div>
                            </form>
                        </div>

                        {/* إدارة المنتجات الحالية */}
                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
                            <h2 className="text-2xl font-bold mb-6 text-gray-800">المنتجات الحالية ({products.length})</h2>
                            <div className="space-y-3">
                                {products.map(p => (
                                    <div key={p.id} className="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
                                        <div className="flex items-center gap-3">
                                            <img src={p.image} className="w-12 h-12 rounded-xl object-cover" />
                                            <div>
                                                <h4 className="font-bold text-gray-800">{p.name}</h4>
                                                <span className="text-xs text-rose-600 font-bold">{p.price} ج.م | {p.category}</span>
                                            </div>
                                        </div>
                                        <button onClick={() => deleteProduct(p.id)} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                                            حذف
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* سجل الطلبات الواردة */}
                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
                            <h2 className="text-2xl font-bold mb-6 text-gray-800">طلبات العملاء الواردة ({orders.length})</h2>
                            {orders.length === 0 ? (
                                <p className="text-gray-400 text-center py-6">لا توجد طلبات جديدة حتى الآن</p>
                            ) : (
                                <div className="space-y-4">
                                    {orders.map(ord => (
                                        <div key={ord.id} className="border border-gray-100 bg-gray-50 rounded-2xl p-6">
                                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                                <span className="font-bold text-gray-800">العميل: {ord.customerName}</span>
                                                <span className="text-xs bg-gray-200 text-gray-600 px-2.5 py-1 rounded-full">{ord.date}</span>
                                            </div>
                                            <p className="text-sm text-gray-600 mb-1">📞 الهاتف: {ord.customerPhone}</p>
                                            <p className="text-sm text-gray-600 mb-3">📍 العنوان: {ord.customerAddress}</p>
                                            <div className="bg-white p-3 rounded-xl mb-3">
                                                <p className="text-xs font-bold text-gray-500 mb-1">المنتجات المطلوبة:</p>
                                                {ord.items.map((it, i) => (
                                                    <div key={i} className="text-sm flex justify-between">
                                                        <span>• {it.name}</span>
                                                        <span className="font-bold">{it.price} ج.م</span>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex justify-between items-center font-bold text-base pt-2 border-t">
                                                <span>إجمالي الفاتورة:</span>
                                                <span className="text-rose-600">{ord.total} ج.م</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    <footer className="bg-white border-t py-6 text-center text-sm text-gray-500 mt-12">
                        جميع الحقوق محفوظة لوحة إدارة ريفال © 2026
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
    </script>
</body>
</html>
