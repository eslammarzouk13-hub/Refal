<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ريفال للعطور والمكياج | المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function CustomerApp() {
            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('refal_products');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'عطر ريفال الملكي الفاخر', price: 950, category: 'عطور', stock: 12, image: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400' },
                    { id: 2, name: 'أحمر شفاه مات ثاتش', price: 420, category: 'مكياج', stock: 20, image: 'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=400' },
                    { id: 3, name: 'عطر المسحر العطري', price: 750, category: 'عطور', stock: 8, image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400' }
                ];
            });

            const [cart, setCart] = React.useState([]);

            const addToCart = (product) => {
                setCart([...cart, product]);
                alert('تمت إضافة المنتج إلى سلة المشتريات بنجاح!');
            };

            const checkout = (e) => {
                e.preventDefault();
                if(cart.length === 0) {
                    alert('سلة المشتريات فارغة!');
                    return;
                }
                const customerName = e.target.cname.value;
                const customerPhone = e.target.cphone.value;
                const customerAddress = e.target.caddress.value;

                const newOrder = {
                    id: Date.now(),
                    customerName,
                    customerPhone,
                    customerAddress,
                    items: cart,
                    total: cart.reduce((sum, item) => sum + item.price, 0),
                    date: new Date().toLocaleString()
                };

                const savedOrders = JSON.parse(localStorage.getItem('refal_orders') || '[]');
                localStorage.setItem('refal_orders', JSON.stringify([newOrder, ...savedOrders]));
                
                setCart([]);
                alert('تم إرسال طلبك بنجاح! شكراً لاختيارك ريفال.');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <span className="text-2xl font-black text-rose-600">✨ ريفال للعطور والمكياج</span>
                            <a href="admin.html" className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl font-bold transition">
                                ⚙️ دخول الإدارة
                            </a>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
                        <div className="bg-gradient-to-r from-rose-500 to-pink-600 rounded-3xl p-8 mb-8 text-white shadow-lg text-center">
                            <h1 className="text-3xl md:text-4xl font-extrabold mb-2">أهلاً بكم في متجر ريفال</h1>
                            <p className="text-rose-100 text-lg">أرقى براندات العطور وأدوات التجميل الأصلية في مصر</p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <h2 className="text-2xl font-bold mb-6 text-gray-800">المنتجات المتاحة</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition">
                                            <img src={p.image} alt={p.name} className="h-52 w-full object-cover" />
                                            <div className="p-5 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <span className="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-full font-bold">{p.category}</span>
                                                    <h3 className="font-bold text-lg mt-3 text-gray-800">{p.name}</h3>
                                                    <p className="text-rose-600 font-black text-xl mt-1">{p.price} ج.م</p>
                                                </div>
                                                <button onClick={() => addToCart(p)} className="mt-5 w-full bg-rose-600 text-white py-3 rounded-xl font-bold hover:bg-rose-700 transition shadow-sm">
                                                    إضافة إلى السلة 🛒
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 h-fit">
                                <h2 className="text-xl font-bold mb-4 text-gray-800 border-b pb-3">سلة المشتريات ({cart.length})</h2>
                                {cart.length === 0 ? (
                                    <p className="text-gray-400 text-center py-6">السلة فارغة حالياً</p>
                                ) : (
                                    <div>
                                        <div className="space-y-3 mb-6 max-h-60 overflow-y-auto">
                                            {cart.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                                                    <span className="font-medium text-sm">{item.name}</span>
                                                    <span className="font-bold text-rose-600 text-sm">{item.price} ج.م</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="border-t pt-4 mb-6 flex justify-between items-center text-lg font-bold">
                                            <span>الإجمالي:</span>
                                            <span className="text-rose-600">{cart.reduce((sum, i) => sum + i.price, 0)} ج.م</span>
                                        </div>
                                        <form onSubmit={checkout} className="space-y-4">
                                            <h3 className="font-bold text-sm text-gray-700">بيانات التوصيل:</h3>
                                            <input name="cname" required placeholder="الاسم الكامل" className="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-rose-500" />
                                            <input name="cphone" required placeholder="رقم الهاتف (مثال: 010xxxxxxxx)" className="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-rose-500" />
                                            <input name="caddress" required placeholder="العنوان بالتفصيل (المدينة، الشارع)" className="w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-rose-500" />
                                            <button type="submit" className="w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-black transition shadow-md">
                                                تأكيد الطلب الآن 📦
                                            </button>
                                        </form>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="bg-white border-t py-6 text-center text-sm text-gray-500 mt-12">
                        جميع الحقوق محفوظة لمتجر ريفال للعطور والمكياج © 2026
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<CustomerApp />);
    </script>
</body>
</html>
